<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Client Desk</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0f5e57">
<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#16231f;--mut:#63736e;--line:#dbe3df;--ac:#0f5e57;--acs:#e1f0ed;--warn:#b45309;--warns:#fdf0dc;--bad:#b42318;--ok:#1a7f4b}
@media(prefers-color-scheme:dark){:root{--bg:#101715;--card:#182320;--ink:#e6efec;--mut:#93a6a0;--line:#2a3a35;--ac:#4cc2b3;--acs:#1c3531;--warn:#f0b35a;--warns:#3a2c14;--bad:#ff8a7d;--ok:#5fd09a}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;align-items:center;gap:12px;padding:14px 16px 0;flex-wrap:wrap}
h1{font-size:20px;margin:0;letter-spacing:-.3px}
nav{display:flex;gap:4px;padding:10px 16px;overflow-x:auto}
nav button{border:0;background:none;color:var(--mut);padding:8px 14px;border-radius:99px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--ac);color:var(--bg)}
main{padding:0 16px 40px;max-width:1100px;margin:auto}
#off{display:none;background:var(--warns);color:var(--warn);padding:8px 16px;font-weight:600}
h2{font-size:16px;margin:22px 0 8px;display:flex;align-items:center;gap:8px}
.cnt{background:var(--acs);color:var(--ac);border-radius:99px;padding:0 9px;font-size:13px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--mut);font-weight:600}tr:last-child td{border:0}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--acs)}
small{display:block;color:var(--mut)}
button.b{border:1px solid var(--ac);background:var(--ac);color:var(--bg);border-radius:8px;padding:7px 12px;font:inherit;font-weight:600;cursor:pointer;margin:2px 4px 2px 0}
button.b.o{background:none;color:var(--ac)}button.b.r{background:none;border-color:var(--bad);color:var(--bad)}
button:disabled{opacity:.5}
.badge{display:inline-block;background:var(--warns);color:var(--warn);border-radius:6px;padding:2px 8px;font-size:13px;font-weight:600}
.badge.g{background:var(--acs);color:var(--ok)}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
textarea{min-height:90px}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:10px 0 3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#mb{position:fixed;inset:0;background:#0009;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:max(16px,env(safe-area-inset-top)) 12px;z-index:5}
#m{background:var(--card);border-radius:14px;padding:18px;width:100%;max-width:640px;margin:auto}
#m h3{margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.bar input,.bar select{width:auto;flex:1;min-width:150px}
#search{font-size:17px;padding:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tabs button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
.tabs button.on{border-color:var(--ac);background:var(--acs);color:var(--ac)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;display:none;z-index:9;max-width:90%}
.mut{color:var(--mut)}.pre{white-space:pre-wrap}

#lock{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;align-items:center;justify-content:center;padding:20px}
#lock>div{width:100%;max-width:340px}#lock h1{font-size:24px;margin-bottom:4px}
#le{color:var(--bad);min-height:22px;margin:6px 0}
#sy{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.wc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;align-content:start}
.wc[onclick]{cursor:pointer}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.nums span{font-size:12px;color:var(--mut)}.nums b{display:block;font-size:14px;color:var(--ink)}
.nums b.du{color:var(--bad)}
h2.s-Upcoming{border-left:4px solid var(--warn);padding-left:8px}h2.s-Running{border-left:4px solid var(--ac);padding-left:8px}h2.s-Completed{border-left:4px solid var(--ok);padding-left:8px}
nav button{padding:8px 12px}
</style>
</head>
<body>
<div id="lock"><div><h1>Client Desk</h1><p class="mut">Password daalo</p><input id="lp" type="password" autocomplete="current-password" placeholder="Password"><div id="le"></div><button class="b" id="lb" style="width:100%;padding:11px">Kholo</button></div></div>
<div id="off">📴 Offline ho — kaam chalta rahega, data phone me save hai. Internet aate hi apne aap Sheet me sync ho jayega.</div>
<header><h1>Client Desk</h1><span id="sy"></span><button class="b o" id="inst" style="display:none">App install karo</button></header>
<nav id="nav"></nav>
<main id="v"></main>
<div id="mb"><div id="m"></div></div>
<div id="toast"></div>
<script>
const DEFAULT_API='https://script.google.com/macros/s/AKfycbyYw03VeCYKDtNWiWTX_R4oz9bT5SiX3nVpXwZ6SkRouhTOFk1g-uNzZCxJ1Uld_NVTkw/exec';
const SERVICES=['Control Management System','Attendance Management System','Custom Form','Website'];
const MODES=['Cash','UPI','Bank','Cheque'];
const PURPOSES=[['general','General update'],['started','Kaam start'],['update_received','Request mili'],['update_completed','Update complete'],['payment','Payment reminder'],['payment_received','Payment mil gaya'],['final_summary','Final thank-you']];
const PAYP=['payment','payment_received','final_summary'];
const STAGES=['Upcoming','Running','Completed'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cfg=()=>{try{return JSON.parse(localStorage.cm||'{}')}catch{return{}}};
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const fdt=v=>new Date(v).toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true})+' IST';
let S={clients:[],projects:[],pay:{},up:{}},tab='work',q='',flt='all',C={},PW='',hid=0;
const pr=id=>S.projects.find(p=>p.id===id);
const cl=id=>S.clients.find(c=>c.id===id)||{name:'?',email:'',phone:''};
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3800)}
async function api(action,body={}){
  const E=(m,net)=>{const e=new Error(m);if(net)e.net=1;return e};
  if(!navigator.onLine)throw E('Offline ho',1);
  let r,j;const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),/^(generateDrafts|sendMail)$/.test(action)?90000:30000);
  try{r=await fetch(DEFAULT_API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({password:PW,action},body)),signal:ac.signal});j=await r.json()}
  catch(x){clearTimeout(tm);const e=E(r?'Server se galat jawab aaya':"Connect nahi hua. Deployment 'Anyone' access par hona chahiye.",1);if(r)e.bad=1;throw e}
  clearTimeout(tm);
  if(!j.ok)throw E(j.error==='Wrong password'?'Password galat hai':(j.error||'Server error'));return j}
async function run(fn,ok){try{const r=await fn();if(ok)toast(ok);return r}catch(e){toast(e.message);if(e.message==='Password galat hai')lockNow(true);return null}}
/* ---- Lock ---- */
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('cm:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function lockNow(forget){PW='';closeM();if(forget){localStorage.removeItem('cmh')}$('#lp').value='';$('#le').textContent='';$('#lock').style.display='flex';$('#lp').focus()}
function showApp(){$('#lock').style.display='none';draw()}
async function unlock(){
  const v=$('#lp').value;if(!v)return;$('#le').textContent='';const h=await sha(v),saved=localStorage.cmh,cache=localStorage.cmd;
  if(saved&&cache){ // fast path: local data turant, offline bhi chalta hai; server se peeche sync
    if(h!==saved){$('#le').textContent='Password galat hai';return}
    PW=v;loadLocal();showApp();setSy();kick();sync();return}
  const b=$('#lb');b.disabled=true;b.textContent='Check ho raha hai…';PW=v;
  try{const j=await api('getAll');loadLocal();SV.clients=j.clients;SV.projects=j.projects;localStorage.cmh=h;persist();derive();showApp();setSy();kick()}
  catch(e){PW='';$('#le').textContent=e.message}
  b.disabled=false;b.textContent='Kholo'}
$('#lb').onclick=unlock;$('#lp').onkeydown=e=>{if(e.key==='Enter')unlock()};
document.addEventListener('visibilitychange',()=>{if(document.hidden)hid=Date.now();else if(PW&&Date.now()-hid>10*60e3)lockNow()});
/* ---- Data ---- */
/* ---- Offline-first data layer ----
   SV = server ka last snapshot, Q = jo changes abhi Sheet tak nahi pahunche (localStorage me saved).
   S (jo screen par dikhta hai) = SV + Q. Har change turant S me dikhta hai aur ~1 sec me background me Sheet par jata hai. */
const POLL_MS=8000,CREATE=['cli+','prj+','pay+','up+'];
const tid=()=>'t_'+Date.now().toString(36)+(Math.random().toString(36)+'0000').slice(2,6),isT=x=>/^t_[a-z0-9]{10,}$/.test(x||'');
const blank=()=>({clients:[],projects:[],pay:{},up:{}});
let SV=blank(),Q=[],fp=null,busy=false,syncing=false,ver=0,ft=0,curD='',needPay=new Set();
function persist(){try{localStorage.cmd=JSON.stringify(SV);localStorage.cmq=JSON.stringify(Q)}catch{toast('Phone ki storage full hai!')}}
function loadLocal(){let s;try{s=JSON.parse(localStorage.cmd||'null')}catch{}SV=Object.assign(blank(),s||{});try{Q=JSON.parse(localStorage.cmq||'[]')}catch{Q=[]}derive()}
function derive(){const d=JSON.parse(JSON.stringify(SV));Q.forEach(o=>ap(d,o));S=d}
function softDraw(){const a=document.activeElement;if(a&&$('#v').contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;draw()}
function setSy(){const e=$('#sy');if(e)e.textContent=!navigator.onLine?'📴 Offline':Q.length?'⏳ '+Q.length+' sync baaki':'✓ Synced'}
/* ek change ko local state par lagao (screen ke liye aur snapshot ke liye) */
function ap(d,o){
  const P=id=>d.projects.find(x=>x.id===id),Cl=id=>d.clients.find(x=>x.id===id),n=v=>+v||0,fix=p=>{p.dues=Math.max(0,p.total-p.paid)};
  d.pay=d.pay||{};d.up=d.up||{};
  switch(o.t){
  case'cli+':d.clients.push(Object.assign({id:o.id,company:''},o.client));break;
  case'cli~':{const c=Cl(o.client.id);if(c){Object.assign(c,o.client);d.projects.forEach(p=>{if(p.clientId===c.id){p.clientName=c.name;p.phone=c.phone;p.email=c.email}})}break}
  case'cli-':d.clients=d.clients.filter(c=>c.id!==o.id);d.projects=d.projects.filter(p=>p.clientId!==o.id);break;
  case'prj+':{const j=o.project;let c=j.clientId?Cl(j.clientId):null;
    if(!c&&j.newClient){c=Object.assign({id:o.cid,company:''},j.newClient);d.clients.push(c)}
    c=c||{id:j.clientId,name:'?',phone:'',email:''};
    const p={id:o.id,clientId:c.id,clientName:c.name,phone:c.phone,email:c.email,service:j.service,status:j.status,days:n(j.days),total:n(j.total),paid:n(j.paid),note:j.note||'',archived:false,pending:0};fix(p);d.projects.push(p);break}
  case'prj~':{const p=P(o.id);if(!p)break;const k=o.patch;if(k.status!=null)p.status=k.status;if(k.days!=null)p.days=n(k.days);if(k.total!=null)p.total=n(k.total);if(k.note!=null)p.note=k.note;fix(p);break}
  case'arch':{const p=P(o.id);if(p)p.archived=o.archived;break}
  case'prj-':d.projects=d.projects.filter(p=>p.id!==o.id);delete d.pay[o.id];delete d.up[o.id];break;
  case'pay+':{const p=P(o.projectId);(d.pay[o.projectId]=d.pay[o.projectId]||[]).push({id:o.id,projectId:o.projectId,amount:n(o.payment.amount),paidAt:o.payment.paidAt,mode:o.payment.mode,note:o.payment.note});if(p){p.paid+=n(o.payment.amount);fix(p)}break}
  case'pay-':{const l=d.pay[o.projectId];if(l)d.pay[o.projectId]=l.filter(x=>x.id!==o.id);const p=P(o.projectId);if(p){p.paid=Math.max(0,p.paid-n(o.amount));fix(p)}break}
  case'up+':{(d.up[o.projectId]=d.up[o.projectId]||[]).push({id:o.id,projectId:o.projectId,type:o.type,description:o.description,days:o.days,status:'Pending'});const p=P(o.projectId);if(p)p.pending=(p.pending||0)+1;break}
  case'up~':{const u=(d.up[o.projectId]||[]).find(x=>x.id===o.id);if(u&&u.status!==o.status){u.status=o.status;const p=P(o.projectId);if(p&&o.status==='Completed')p.pending=Math.max(0,(p.pending||0)-1)}break}
  }}
/* har user action yahin se: turant local + queue, phir ~0.7 sec me Sheet par bhejna shuru */
function enq(o){Q.push(o);ver++;persist();derive();draw();setSy();kick()}
function kick(ms=700){clearTimeout(ft);ft=setTimeout(flush,ms)}
function remap(a,b){const f=s=>s.split('"'+a+'"').join('"'+b+'"');SV=JSON.parse(f(JSON.stringify(SV)));Q=JSON.parse(f(JSON.stringify(Q)));['clientId','projectId','updateId'].forEach(k=>{if(C[k]===a)C[k]=b})}
function unresolved(o){const c=Object.assign({},o);delete c.cid;if(CREATE.includes(o.t))delete c.id;return /"t_[a-z0-9]{10,}"/.test(JSON.stringify(c))}
function flush(){return fp||(fp=doFlush().finally(()=>{fp=null}))}
async function doFlush(){
  if(!PW||!Q.length||!navigator.onLine)return;
  busy=true;ver++;setSy();
  try{while(Q.length){
    const o=Q[0];
    try{
      if(unresolved(o))throw new Error('Isse pehle wala change save nahi ho paya');
      fin(o,await send(o));
    }catch(e){
      if(e.message==='Password galat hai'){lockNow(true);return}
      if(e.net&&!(e.bad&&(o.bad=(o.bad||0)+1)>=3)){o.amb=1;return} // internet nahi: queue safe hai, baad me retry
      reject(o,e)}
  }}finally{busy=false;persist();derive();setSy();softDraw();if(PW&&!Q.length)after()}}
async function send(o){
  if(o.amb){const v=await verify(o);if(v)return v}
  switch(o.t){
  case'cli+':return api('saveClient',{client:o.client});
  case'cli~':return api('updateClient',{client:o.client});
  case'cli-':return api('deleteClient',{clientId:o.id});
  case'prj+':return api('saveProject',{project:o.project});
  case'prj~':return api('updateProject',{projectId:o.id,patch:o.patch});
  case'arch':return api('setArchived',{projectId:o.id,archived:o.archived});
  case'prj-':return api('deleteProject',{projectId:o.id});
  case'pay+':return api('addPayment',{payment:Object.assign({projectId:o.projectId},o.payment)});
  case'pay-':return api('deletePayment',{paymentId:o.id});
  case'up+':return api('addUpdate',{update:{projectId:o.projectId,type:o.type,description:o.description,days:o.days}});
  case'up~':return api('setUpdateStatus',{updateId:o.id,status:o.status})}}
/* pichhli koshish me jawab nahi aaya tha: check karo kahin server par ban to nahi gaya (duplicate se bachne ke liye) */
async function verify(o){
  const same=(a,b)=>String(a||'').trim()===String(b||'').trim();
  if(o.t==='pay+'){const a=await api('getPayments',{projectId:o.projectId}),k=(SV.pay[o.projectId]||[]).map(x=>x.id);
    const m=a.payments.find(x=>!k.includes(x.id)&&+x.amount===+o.payment.amount&&Math.abs(new Date(x.paidAt)-new Date(o.payment.paidAt))<2000);return m?{payment:m}:null}
  if(o.t==='up+'){const a=await api('getUpdates',{projectId:o.projectId}),k=(SV.up[o.projectId]||[]).map(x=>x.id);
    const m=a.updates.find(x=>!k.includes(x.id)&&same(x.description,o.description)&&same(x.type,o.type));return m?{update:m}:null}
  if(o.t==='cli+'||o.t==='prj+'){const a=await api('getAll'),kc=SV.clients.map(x=>x.id),kp=SV.projects.map(x=>x.id);
    if(o.t==='cli+'){const m=a.clients.find(x=>!kc.includes(x.id)&&same(x.name,o.client.name)&&same(x.email,o.client.email));return m?{client:m}:null}
    const j=o.project,m=a.projects.find(x=>!kp.includes(x.id)&&x.service===j.service&&+x.total===+j.total&&x.status===j.status&&(j.clientId?x.clientId===j.clientId:same(x.clientName,j.newClient.name)));return m?{project:m}:null}
  return null}
/* server ne change le liya: temp id -> asli id, snapshot aage badhao */
function fin(o,r){
  if(o.t==='cli+'&&r.client)remap(o.id,r.client.id);
  else if(o.t==='prj+'&&r.project){remap(o.id,r.project.id);if(o.cid&&r.project.clientId)remap(o.cid,r.project.clientId)}
  else if(o.t==='up+'&&r.update)remap(o.id,r.update.id);
  else if(o.t==='pay+'){const id=(r.payment&&r.payment.id)||r.id;if(id)remap(o.id,id);else needPay.add(o.projectId)}
  const o2=Q.shift(),hp=SV.pay[o2.projectId],hu=SV.up[o2.projectId];
  ap(SV,o2);if(!hp)delete SV.pay[o2.projectId];if(!hu)delete SV.up[o2.projectId];persist()}
/* server ne mana kar diya (validation etc.): change wapas, aur user ko bata do */
function reject(o,e){
  Q.shift();const ids=[o.id,o.cid].filter(isT);if(ids.length)Q=Q.filter(x=>!ids.some(i=>JSON.stringify(x).includes('"'+i+'"')));
  persist();derive();draw();
  const N={'cli+':'Naya client','cli~':'Client edit','cli-':'Client delete','prj+':'Naya kaam','prj~':'Kaam update','arch':'History move','prj-':'Kaam delete','pay+':'Payment add','pay-':'Payment delete','up+':'Request add','up~':'Request complete'};
  alert('⚠️ '+(N[o.t]||'Change')+' Sheet me save nahi ho paya, isliye wapas kar diya gaya.\nKaaran: '+e.message)}
/* queue khali hone ke baad: payment ids theek karo, fresh snapshot lo */
async function after(){
  for(const pid of [...needPay]){try{const a=await api('getPayments',{projectId:pid});if(Q.length)break;SV.pay[pid]=a.payments;needPay.delete(pid)}catch(e){break}}
  persist();derive();await sync();if(curD)dFetch(curD)}
/* Sheet -> app: naya data (dusre device / Sheet se) dikhane ke liye; pending changes ko kabhi overwrite nahi karta */
async function sync(force){
  if(!PW||syncing||busy||Q.length||!navigator.onLine)return;
  syncing=true;const v=ver;
  try{const j=await api('getAll');if(v!==ver||busy||Q.length)return;
    if(JSON.stringify([j.clients,j.projects])!==JSON.stringify([SV.clients,SV.projects])){SV.clients=j.clients;SV.projects=j.projects;persist();derive();softDraw()}
    setSy()}
  catch(e){if(e.message==='Password galat hai')lockNow(true);else if(force)toast(e.message)}
  finally{syncing=false}}
async function ready(){const t=()=>[C.clientId,C.projectId,C.updateId].some(isT);if(t()){toast('Sync ho raha hai…');await flush()}if(t()){toast('Abhi sync nahi hua — internet aane par mail bhejo');return false}return true}
function modal(h){$('#m').innerHTML=h;$('#mb').style.display='flex'}
function closeM(){curD='';$('#mb').style.display='none'}
$('#mb').onclick=e=>{if(e.target.id==='mb')closeM()};
function nav(){$('#nav').innerHTML=[['work','Client Work'],['cli','Clients'],['hist','History'],['mail','Quick Mail'],['set','Settings']].map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';draw()">${l}</button>`).join('')}
function draw(){if(!PW)return;nav();({work:vWork,cli:vCli,hist:vHist,mail:vMail,set:vSet})[tab]()}

/* ---- Client Work ---- */
function acts(p){
  if(p.status==='Upcoming')return `<button class="b" onclick="event.stopPropagation();setStage('${p.id}','Running')">Running karo</button>`;
  if(p.status==='Running')return `<button class="b" onclick="event.stopPropagation();setStage('${p.id}','Completed')">Complete karo</button>`;
  return p.dues>0?`<span class="badge">Payment baaki</span>`:`<button class="b" onclick="event.stopPropagation();arch('${p.id}',true)">Client history me bhejo</button>`}
function wcard(p){return `<div class="wc" onclick="detail('${p.id}')"><div><b>${esc(p.clientName)}</b><small>${esc(p.phone)} ${esc(p.email)}</small></div>
  <div>${isT(p.id)?'⏳ ':''}${esc(p.service)}${p.pending?` <span class="badge">${p.pending} request</span>`:''}</div>
  <div class="nums"><span>Days<b>${p.days||'-'}</b></span><span>Total<b>${money(p.total)}</b></span><span>Paid<b>${money(p.paid)}</b></span><span>Dues<b class="${p.dues>0?'du':''}">${money(p.dues)}</b></span></div><div>${acts(p)}</div></div>`}
function vWork(){
  const live=S.projects.filter(p=>!p.archived);
  $('#v').innerHTML=`<div class="bar"><button class="b" onclick="newWork()">+ Naya kaam</button><button class="b o" onclick="compose({})">Mail likho</button></div>`+
  STAGES.map(st=>{const L=live.filter(p=>p.status===st);return `<h2 class="s-${st}">${st} <span class="cnt">${L.length}</span></h2><div class="grid">${L.map(wcard).join('')||'<p class="mut">Koi kaam nahi</p>'}</div>`}).join('')}
function setStage(id,status){enq({t:'prj~',id,patch:{status}});toast(status+' ho gaya')}
function arch(id,archived){enq({t:'arch',id,archived});closeM();toast(archived?'History me bhej diya':'Wapas Completed me aa gaya')}
function newWork(){
  modal(`<h3>Naya kaam</h3><label>Client</label><select id="nc" onchange="$('#nn').style.display=this.value?'none':'block'"><option value="">+ Naya client</option>${S.clients.map(c=>`<option value="${c.id}">${esc(c.name)} (${esc(c.phone)})</option>`).join('')}</select>
  <div id="nn"><div class="g2"><div><label>Naam</label><input id="cn"></div><div><label>Phone</label><input id="cp" inputmode="tel"></div></div><label>Email (zaroori)</label><input id="ce" type="email"></div>
  <div class="g2"><div><label>Service</label><select id="sv">${SERVICES.map(s=>`<option>${s}</option>`).join('')}</select></div><div><label>Section</label><select id="sg"><option>Upcoming</option><option>Running</option></select></div>
  <div><label>Days</label><input id="dy" type="number" min="0"></div><div><label>Total amount</label><input id="tt" type="number" min="0" oninput="calc()"></div>
  <div><label>Advance / paid</label><input id="ad" type="number" min="0" oninput="calc()"></div><div><label>Dues</label><input id="du" readonly></div></div>
  <label>Internal note (AI ko nahi jata)</label><textarea id="nt"></textarea>
  <div class="bar"><button class="b" id="svb" onclick="saveWork()">Save</button><button class="b o" onclick="closeM()">Cancel</button></div>`)}
function calc(){$('#du').value=Math.max(0,(+$('#tt').value||0)-(+$('#ad').value||0))}
function saveWork(){
  const cid=$('#nc').value,p={service:$('#sv').value,status:$('#sg').value,days:$('#dy').value,total:$('#tt').value,paid:$('#ad').value,note:$('#nt').value},o={t:'prj+',id:tid(),project:p};
  if(cid)p.clientId=cid;else{const n={name:$('#cn').value.trim(),phone:$('#cp').value.trim(),email:$('#ce').value.trim()};if(!n.name||!n.email)return toast('Client ka naam aur email zaroori hai');p.newClient=n;o.cid=tid()}
  enq(o);closeM();toast('Kaam save ho gaya');
  if(confirm('"Kaam start" mail bhejna hai?'))compose({clientId:cid||o.cid,projectId:o.id,purpose:'started',work:p.service})}

/* ---- Project detail (turant khulta hai, lists baad me aati hain) ---- */
function detail(id){
  const p=pr(id);if(!p)return;curD=id;
  modal(`<h3>${esc(p.clientName)} — ${esc(p.service)}</h3><small>${esc(p.phone)} ${esc(p.email)}</small>
  <div class="g2"><div><label>Stage</label><select id="ds">${STAGES.map(s=>`<option ${s===p.status?'selected':''}>${s}</option>`).join('')}</select></div><div><label>Days</label><input id="dd" type="number" value="${p.days}"></div>
  <div><label>Total</label><input id="dt" type="number" value="${p.total}" oninput="$('#dq').value=this.value-${p.paid}"></div><div><label>Paid (payments ka sum)</label><input readonly value="${p.paid}"></div></div>
  <label>Dues</label><input id="dq" readonly value="${p.dues}"><label>Internal note</label><textarea id="dn">${esc(p.note)}</textarea>
  <div class="bar"><button class="b" onclick="saveDetail('${id}')">Save</button>${p.archived?`<button class="b o" onclick="arch('${id}',false)">Wapas Completed me lao</button>`:''}<button class="b o" onclick="compose({clientId:'${p.clientId}',projectId:'${id}',purpose:'payment',work:'Payment history',includeMoney:true})">Payment history mail</button><button class="b r" onclick="delWork('${id}')">Kaam delete</button></div>
  <h2>Payments</h2><div id="dpl"></div>
  <div class="g2"><div><label>Amount</label><input id="pa" type="number" min="1"></div><div><label>Date & time</label><input id="pd" type="datetime-local" value="${nowLocal()}"></div><div><label>Mode</label><select id="pm">${MODES.map(m=>`<option>${m}</option>`).join('')}</select></div><div><label>Note</label><input id="pn"></div></div>
  <div class="bar"><button class="b" onclick="addPay('${id}')">Payment add karo</button></div>
  <h2>Change / Update requests</h2><div id="dul"></div>
  <div class="g2"><div><label>Type</label><select id="ut"><option>Change</option><option>Replace</option><option>Update</option></select></div><div><label>Days (optional)</label><input id="ud" type="number"></div></div><label>Note</label><input id="un">
  <div class="bar"><button class="b o" onclick="addUp('${id}')">Request add karo</button></div><div class="bar"><button class="b o" onclick="closeM()">Band karo</button></div>`);
  dLists(id);dFetch(id)}
function dLists(id){
  const a=$('#dpl'),b=$('#dul');if(!a||curD!==id)return;
  const T=x=>isT(x)?'⏳ ':'',ph=k=>k?'':`<p class="mut">${navigator.onLine?'Purani list load ho rahi hai…':'Offline — purani list internet aane par dikhegi'}</p>`;
  a.innerHTML=(S.pay[id]||[]).map(x=>`<div class="card">${T(x.id)}${money(x.amount)} · ${esc(x.mode||'-')} <small>${fdt(x.paidAt)}${x.note?' · '+esc(x.note):''}</small><button class="b r" onclick="delPay('${x.id}','${id}')">Delete</button></div>`).join('')+ph(SV.pay[id])||'<p class="mut">Abhi koi payment nahi</p>';
  b.innerHTML=(S.up[id]||[]).map(u=>`<div class="card">${T(u.id)}<b>${esc(u.type)}</b> <span class="badge ${u.status==='Completed'?'g':''}">${u.status}</span><div>${esc(u.description)}</div><small>${u.days?u.days+' din':''}</small>${u.status!=='Completed'?`<button class="b" onclick="doneUp('${u.id}','${id}')">Complete karke mail bhejo</button>`:''}</div>`).join('')+ph(SV.up[id])}
async function dFetch(id){
  if(!id||isT(id)||busy||Q.length||!PW||!navigator.onLine)return;const v=ver;
  try{const[a,b]=await Promise.all([api('getPayments',{projectId:id}),api('getUpdates',{projectId:id})]);
    if(v!==ver||busy||Q.length)return;SV.pay[id]=a.payments;SV.up[id]=b.updates;persist();derive();dLists(id)}catch(e){}}

function nowLocal(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
function saveDetail(id){enq({t:'prj~',id,patch:{status:$('#ds').value,days:$('#dd').value,total:$('#dt').value,note:$('#dn').value}});toast('Save ho gaya')}
function delWork(id){const p=pr(id);if(!confirm(`"${p.clientName} — ${p.service}" delete karein? Uski payments aur requests bhi delete ho jayengi.`))return;
  enq({t:'prj-',id});closeM();toast('Kaam delete ho gaya')}
function addPay(id){
  const amt=$('#pa').value;if(!(+amt>0))return toast('Amount daalo');
  const paidAt=($('#pd').value?new Date($('#pd').value):new Date()).toISOString();
  enq({t:'pay+',id:tid(),projectId:id,payment:{amount:amt,paidAt,mode:$('#pm').value,note:$('#pn').value}});
  toast('Payment add ho gayi');detail(id);const p=pr(id);
  if(confirm('"Payment mil gayi" mail bhejna hai?'))return compose({clientId:p.clientId,projectId:id,purpose:'payment_received',work:'Payment received',includeMoney:true});
  if(p.status==='Completed'&&p.dues===0&&confirm('Dues 0 hain. Client history me bhejein?'))arch(id,true)}
function delPay(pid,id){if(!confirm('Payment delete karein?'))return;
  const x=(S.pay[id]||[]).find(y=>y.id===pid)||{},qi=Q.findIndex(o=>o.t==='pay+'&&o.id===pid);
  if(qi>-1&&!(qi===0&&busy)){Q.splice(qi,1);ver++;persist();derive();draw();setSy()}else enq({t:'pay-',id:pid,projectId:id,amount:+x.amount||0});
  toast('Payment delete ho gayi');detail(id)}
function addUp(id){const t=$('#ut').value,n=$('#un').value,uid=tid();
  enq({t:'up+',id:uid,projectId:id,type:t,description:n,days:$('#ud').value});toast('Request add ho gayi');detail(id);
  if(confirm('"Request mili" mail bhejna hai?'))compose({clientId:pr(id).clientId,projectId:id,purpose:'update_received',work:t+' request',details:n,updateId:uid})}
function doneUp(uid,id){const u=(S.up[id]||[]).find(x=>x.id===uid)||{};
  enq({t:'up~',id:uid,projectId:id,status:'Completed'});toast('Completed mark ho gaya');
  compose({clientId:pr(id).clientId,projectId:id,purpose:'update_completed',work:(u.type||'Update')+' complete',details:u.description||'',updateId:uid})}

/* ---- Clients (add / edit / delete) ---- */
function vCli(){
  $('#v').innerHTML=`<div class="bar"><button class="b" onclick="cliForm()">+ Naya client</button></div><div class="grid">${S.clients.map(c=>{const n=S.projects.filter(p=>p.clientId===c.id).length;
  return `<div class="wc"><div><b>${esc(c.name)}</b><small>${esc(c.phone)}</small><small>${esc(c.email)}${c.company?' · '+esc(c.company):''}</small></div><small>${n} kaam</small><div><button class="b o" onclick="cliForm('${c.id}')">Edit</button><button class="b r" onclick="cliDel('${c.id}')">Delete</button></div></div>`}).join('')||'<p class="mut">Abhi koi client nahi</p>'}</div>`}
function cliForm(id){const c=id?cl(id):{};
  modal(`<h3>${id?'Client edit karo':'Naya client'}</h3><label>Naam</label><input id="fn" value="${esc(c.name)}"><div class="g2"><div><label>Phone</label><input id="fp" inputmode="tel" value="${esc(c.phone)}"></div><div><label>Company (optional)</label><input id="fc" value="${esc(c.company)}"></div></div><label>Email</label><input id="fe" type="email" value="${esc(c.email)}">
  <div class="bar"><button class="b" id="fb" onclick="cliSave('${id||''}')">Save</button><button class="b o" onclick="closeM()">Cancel</button></div>`)}
function cliSave(id){
  const c={name:$('#fn').value.trim(),phone:$('#fp').value.trim(),email:$('#fe').value.trim(),company:$('#fc').value.trim()};
  if(!c.name)return toast('Naam likho');if(!id&&!c.email)return toast('Email zaroori hai');
  enq(id?{t:'cli~',client:Object.assign({id},c)}:{t:'cli+',id:tid(),client:c});closeM();toast('Client save ho gaya')}
function cliDel(id){const c=cl(id),n=S.projects.filter(p=>p.clientId===id).length;
  if(!confirm(`"${c.name}" ko delete karein?`+(n?`\n\nIske ${n} kaam, unki payments aur requests bhi delete ho jayengi. Wapas nahi aayega.`:'')))return;
  enq({t:'cli-',id});toast('Client delete ho gaya')}

/* ---- Mail composer ---- */
function compose(o){C=Object.assign({clientId:'',projectId:'',purpose:'general',work:'',details:'',lang:'Hinglish',drafts:[],sel:0,updateId:''},o);if(o.includeMoney===undefined)C.includeMoney=PAYP.includes(C.purpose);cView()}
function cView(){
  const ps=S.projects.filter(p=>p.clientId===C.clientId);
  modal(`<h3>AI mail composer</h3><label>Client</label><select id="cc" onchange="cSync();C.projectId='';cView()"><option value="">Chuno…</option>${S.clients.map(c=>`<option value="${c.id}" ${c.id===C.clientId?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
  <label>Kaam (payment wali mail ke liye zaroori)</label><select id="cp2"><option value="">— koi nahi —</option>${ps.map(p=>`<option value="${p.id}" ${p.id===C.projectId?'selected':''}>${esc(p.service)} (${p.status})</option>`).join('')}</select>
  <div class="g2"><div><label>Purpose</label><select id="cu" onchange="cSync();C.includeMoney=PAYP.includes(C.purpose);cView()">${PURPOSES.map(([k,l])=>`<option value="${k}" ${k===C.purpose?'selected':''}>${l}</option>`).join('')}</select></div><div><label>Language</label><select id="cl">${['English','Hinglish','Hindi'].map(l=>`<option ${l===C.lang?'selected':''}>${l}</option>`).join('')}</select></div></div>
  <label>Title / kaam</label><input id="ct" value="${esc(C.work)}"><label>Description</label><textarea id="cd">${esc(C.details)}</textarea>
  <label><input type="checkbox" id="cy" style="width:auto" ${C.includeMoney?'checked':''}> Payment history + total/paid/dues shamil karo</label>
  <div class="bar"><button class="b" id="gb" onclick="gen()">Drafts banao</button><button class="b o" onclick="closeM()">Band karo</button></div>
  ${C.drafts.length?`<div class="tabs">${C.drafts.map((d,i)=>`<button class="${i===C.sel?'on':''}" onclick="pick(${i})">${esc(d.style||'Draft '+(i+1))}</button>`).join('')}</div>
  <label>Subject</label><input id="es" value="${esc(C.drafts[C.sel].subject)}"><label>Body</label><textarea id="eb" style="min-height:220px">${esc(C.drafts[C.sel].body)}</textarea>
  <div class="bar"><button class="b" onclick="review()">Review &amp; send</button></div>`:''}`)}
function cSync(){C.clientId=$('#cc').value;C.projectId=$('#cp2')?.value||'';C.purpose=$('#cu').value;C.lang=$('#cl').value;C.work=$('#ct').value;C.details=$('#cd').value;C.includeMoney=$('#cy').checked}
function keep(){if($('#es')){C.drafts[C.sel].subject=$('#es').value;C.drafts[C.sel].body=$('#eb').value}}
function pick(i){keep();C.sel=i;cView()}
async function gen(){cSync();if(!C.clientId)return toast('Pehle client chuno');if(!C.work.trim())return toast('Title likho');
  if(C.includeMoney&&!C.projectId)return toast('Payment block ke liye kaam chuno');
  if(!await ready())return;$('#gb').disabled=true;$('#gb').textContent='AI likh raha hai…';
  const r=await run(()=>api('generateDrafts',{clientId:C.clientId,projectId:C.projectId,purpose:C.purpose,work:C.work,details:C.details,language:C.lang,includeMoney:C.includeMoney,count:4,senderName:cfg().sender||''}));
  if(r){C.drafts=r.drafts;C.sel=0}cView()}
function review(){keep();const c=cl(C.clientId),d=C.drafts[C.sel];
  modal(`<h3>Review &amp; send</h3><p><b>To:</b> ${esc(c.email)}</p><p><b>Subject:</b> ${esc(d.subject)}</p><div class="card pre">${esc(d.body)}</div>
  <div class="bar"><button class="b" id="sb" onclick="doSend()">Haan, bhejo</button><button class="b o" onclick="cView()">Wapas edit karo</button></div>`)}
async function doSend(){const d=C.drafts[C.sel];$('#sb').disabled=true;if(!await ready()){$('#sb').disabled=false;return}
  const r=await run(()=>api('sendMail',{clientId:C.clientId,projectId:C.projectId,purpose:C.purpose,work:C.work,subject:d.subject,body:d.body,updateId:C.updateId}),'Mail bhej di');
  if(r){closeM()}else review()}

/* ---- History ---- */
function vHist(){$('#v').innerHTML=`<div class="bar"><input id="search" placeholder="Naam, phone, email ya service search karo" value="${esc(q)}" oninput="q=this.value;hList()"></div>
  <div class="tabs">${[['all','Sab'],['clear','Payment clear'],['dues','Dues baaki']].map(([k,l])=>`<button class="${flt===k?'on':''}" onclick="flt='${k}';vHist()">${l}</button>`).join('')}</div><div id="hl"></div>`;hList()}
function hList(){
  const s=q.toLowerCase(),g={};
  S.projects.forEach(p=>{(g[p.clientId]=g[p.clientId]||[]).push(p)});
  const L=Object.keys(g).filter(id=>{const a=g[id];if(!a.some(p=>p.archived))return false;
    const hit=!s||a.map(p=>[p.clientName,p.phone,p.email,p.service].join(' ')).join(' ').toLowerCase().includes(s);
    const dues=a.some(p=>p.dues>0);return hit&&(flt==='all'||(flt==='clear'&&!dues)||(flt==='dues'&&dues))});
  $('#hl').innerHTML=L.map(id=>{const a=g[id],p=a[0];return `<div class="card" style="cursor:pointer" onclick="cHist('${id}')"><b>${esc(p.clientName)}</b><small>${esc(p.phone)} ${esc(p.email)} · ${a.filter(x=>x.archived).length} kaam history me</small></div>`}).join('')||'<p class="mut">Koi client nahi mila. Kaam tab history me aata hai jab Completed ho aur dues 0 ho.</p>'}
async function cHist(id){if(isT(id))return toast('Abhi sync ho raha hai, 2-3 sec baad dekho');
  modal('<p class="mut">Load ho raha hai…</p>');
  const r=await run(()=>api('getClientHistory',{clientId:id}));if(!r)return closeM();
  const h=r.history,c=h.client;
  modal(`<h3>${esc(c.name)}</h3><small>${esc(c.phone)} ${esc(c.email)}</small>`+
  h.projects.map(p=>`<div class="card"><b>${esc(p.service)}</b> — ${money(p.total)} · ${p.status}${p.archived?'':' <span class="badge">Abhi history me nahi</span>'}<small>Paid ${money(p.paid)} · Dues ${money(p.dues)}</small>
  ${h.payments.filter(x=>x.projectId===p.id).map(x=>`<div>${fdt(x.paidAt)} · ${money(x.amount)} · ${esc(x.mode||'-')}</div>`).join('')}
  <button class="b o" onclick="compose({clientId:'${id}',projectId:'${p.id}',purpose:'payment',work:'Payment history',includeMoney:true})">Payment history mail</button>${p.archived?`<button class="b o" onclick="arch('${p.id}',false)">Wapas Completed me lao</button>`:''}</div>`).join('')+
  `<h2>Bheji gayi mails</h2>`+(h.log.map(m=>`<div class="card"><b>${esc(m.subject)}</b><small>${fdt(m.sentAt)}</small><details><summary>Dekho</summary><div class="pre">${esc(m.body)}</div></details></div>`).join('')||'<p class="mut">Koi mail nahi</p>')+
  `<div class="bar"><button class="b o" onclick="closeM()">Band karo</button></div>`)}

/* ---- Quick Mail / Settings ---- */
function vMail(){$('#v').innerHTML=`<h2>Quick Mail</h2><p class="mut">Kisi bhi client ko AI ki madad se mail likho.</p><button class="b" onclick="compose({})">Mail likho</button>`}
function vSet(){$('#v').innerHTML=`<h2>Settings</h2><div class="card"><label>Sender name (AI mail ke end me)</label><input id="sn" value="${esc(cfg().sender)}"><div class="bar"><button class="b" onclick="localStorage.cm=JSON.stringify({sender:$('#sn').value});toast('Save ho gaya')">Save</button><button class="b o" onclick="flush().then(()=>sync(true)).then(()=>toast(Q.length?Q.length+' change abhi baaki hain':'Sab sync hai'))">Abhi sync karo</button><button class="b o" onclick="lockNow()">App lock karo</button></div><p class="mut">Password badalna ho to Apps Script ke Script Properties me APP_PASSWORD badlo.</p></div>`}

/* ---- PWA ---- */
let ip;addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;$('#inst').style.display='inline-block'});
$('#inst').onclick=async()=>{if(ip){ip.prompt();await ip.userChoice;ip=null;$('#inst').style.display='none'}};
const off=()=>{$('#off').style.display=navigator.onLine?'none':'block';setSy()};addEventListener('online',()=>{off();if(PW){flush();sync()}});addEventListener('offline',off);off();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&PW){flush();sync()}});
setInterval(()=>{if(PW&&Q.length&&!busy)flush()},3000); // internet na ho to har 3 sec retry
setInterval(()=>{if(!document.hidden)sync()},POLL_MS);  // Sheet ka naya data app me
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
$('#lock').style.display='flex';setTimeout(()=>$('#lp').focus(),50);
</script>
